name: Build and Deploy Course Website

# Builds the static course site from the Markdown sources and publishes it to
# datascience.medizin.dev (Hetzner, via SSH) and, for old links, to GitHub
# Pages. Figures (PNG) are committed under module/*/assets and rendered
# as-is; the build itself only needs markdown + pygments. The course packages
# are installed anyway so that tools/check_repo.py can verify every lesson
# snippet against the real library APIs instead of skipping that check.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ml.txt

      - name: Install course packages
        run: pip install -r requirements.txt -r requirements-ml.txt

      # Fängt genau die Fehler ab, die schon einmal ausgeliefert wurden:
      # tote interne Links, verletzter {{DATEN}}-Vertrag, fremde Seeds,
      # Abbildungen unter code/, nicht konfigurierte URLs, Lektions-Snippets,
      # die eine nicht existierende Bibliotheksfunktion aufrufen.
      - name: Repo-Konsistenz prüfen
        run: python tools/check_repo.py

      # build.py bricht selbst ab, wenn config.json noch den Platzhalter trägt,
      # wenn ein {{DATEN}}/{{REPO}} unersetzt bleibt oder ein interner Link
      # ins Leere zeigt.
      - name: Build site
        run: |
          python website/build.py
          touch website/site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/site
          # Ab v5 werden Dateien mit führendem Punkt standardmäßig übersprungen.
          # Der Build legt oben `.nojekyll` an – ohne diese Zeile fiele die Datei
          # stillschweigend aus dem Artefakt.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Lädt dieselbe Seite als tar.gz auf den Server. Der Schlüssel darf dort nur
  # ein Programm starten: Es prüft den Commit-SHA, entpackt in einen neuen
  # Release-Ordner und schaltet `current` erst um, wenn alles da ist.
  # Kein Wiederholen bei Fehlern – der Server sperrt eine Adresse nach
  # fehlgeschlagenen Anmeldungen für einige Minuten.
  deploy-server:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: datascience-medizin-dev
      url: https://datascience.medizin.dev/
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: artifact

      - name: Deploy to datascience.medizin.dev
        env:
          DSC_DEPLOY_HOST: ${{ secrets.DSC_DEPLOY_HOST }}
          DSC_DEPLOY_KEY: ${{ secrets.DSC_DEPLOY_KEY }}
          DSC_DEPLOY_KNOWN_HOSTS: ${{ secrets.DSC_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir site
          tar -xf artifact/artifact.tar -C site
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DSC_DEPLOY_KEY" > ~/.ssh/dsc_deploy
          printf '%s\n' "$DSC_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar czf - -C site . | ssh -i ~/.ssh/dsc_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=1 \
            "dsc-deploy@$DSC_DEPLOY_HOST" "$GITHUB_SHA"
