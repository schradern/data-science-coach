name: Check lesson numbers

# Runs tools/check_numbers.py: every number a lesson asserts in a table or a
# ```text block must still be printed by the module's own code. Separate from
# pages.yml on purpose – the full run needs R and takes several minutes (the
# Modul-14 benchmark alone ~5), and a red check here must never hold back or
# break a deploy. The weekly run catches drift from new package releases even
# when nobody pushes.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: numbers
  cancel-in-progress: true

jobs:
  check-numbers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ml.txt

      - name: Install course packages (Python)
        run: pip install -r requirements.txt -r requirements-ml.txt

      # Binärpakete aus dem öffentlichen Posit Package Manager: Die R-Liste des
      # Kurses aus den Quellen zu kompilieren, dauert ein Vielfaches.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Cache R library
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-${{ hashFiles('tools/install_r_packages.R') }}

      # Ohne diese Bibliotheken scheitern einzelne tidyverse-Abhängigkeiten
      # beim Laden, selbst als Binärpaket.
      - name: Install system libraries for R
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev \
            libpng-dev libtiff5-dev libjpeg-dev

      - name: Install course packages (R)
        run: Rscript tools/install_r_packages.R

      - name: Check lesson numbers against the code
        run: python tools/check_numbers.py
