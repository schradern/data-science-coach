 UI', system-ui, -apple-system, sans-serif">alle bleiben</text><rect x="400" y="70" width="336" height="40" rx="10" fill="#FFFFFF" stroke="#E7E9ED" stroke-width="1"/><text x="416" y="95" font-size="12.5" fill="#16181C" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600">Pat. 1</text><text x="474" y="95" font-size="12.5" fill="#6B7178" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">· Sepsis</text><text x="720" y="95" font-size="12" fill="#1E456B" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-weight="600" text-anchor="end">laktat 2.1</text><rect x="400" y="118" width="336" height="40" rx="10" fill="#FBF3E6"/><text x="416" y="143" font-size="12.5" fill="#16181C" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600">Pat. 2</text><text x="474" y="143" font-size="12.5" fill="#6B7178" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">· Pneumonie</text><text x="720" y="143" font-size="11.5" fill="#9A5B12" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-weight="700" text-anchor="end">laktat = NULL</text><rect x="400" y="166" width="336" height="40" rx="10" fill="#FFFFFF" stroke="#E7E9ED" stroke-width="1"/><text x="416" y="191" font-size="12.5" fill="#16181C" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600">Pat. 3</text><text x="474" y="191" font-size="12.5" fill="#6B7178" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">· Herzinsuff.</text><text x="720" y="191" font-size="12" fill="#1E456B" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-weight="600" text-anchor="end">laktat 1.8</text><rect x="400" y="214" width="336" height="40" rx="10" fill="#FFFFFF" stroke="#E7E9ED" stroke-width="1"/><text x="416" y="239" font-size="12.5" fill="#16181C" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" fon